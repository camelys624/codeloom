services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_workspace
      POSTGRES_USER: agent_workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_workspace_local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_workspace -d agent_workspace']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
