# Modified for Codeloom: deploy through the Compose layout in docs/codeloom-deployment.md.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

# The server is set up once by hand (docs/codeloom-deployment.md §4-6). The
# runner user needs Docker access, passwordless sudo for /opt/codeloom, and
# read access to the env file.
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, production]
    timeout-minutes: 60
    env:
      COMMIT: ${{ github.sha }}
      # Must match the Compose project that owns the existing database volume.
      CODELOOM_PROJECT: ${{ vars.CODELOOM_PROJECT || 'codeloom' }}
      # Optional; the script finds /etc/codeloom/.env.codeloom or
      # /opt/codeloom/.env.codeloom by itself.
      CODELOOM_ENV_FILE: ${{ vars.CODELOOM_ENV_FILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preflight
        run: bash scripts/codeloom-deploy.sh preflight

      - name: Build images
        run: bash scripts/codeloom-deploy.sh build "$COMMIT"

      - name: Stage release
        run: bash scripts/codeloom-deploy.sh stage "$COMMIT"

      - name: Back up database
        run: bash scripts/codeloom-deploy.sh backup

      - name: Switch release
        run: bash scripts/codeloom-deploy.sh switch "$COMMIT"

      # Runs on the Compose network with the backend service's own
      # DATABASE_URL (postgres:5432/$POSTGRES_DB), not against the runner host.
      - name: Run database migrations
        run: bash scripts/codeloom-deploy.sh migrate

      - name: Start and verify
        run: bash scripts/codeloom-deploy.sh start
