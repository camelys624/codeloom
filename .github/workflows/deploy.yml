name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, production]
    timeout-minutes: 15
    steps:
      - name: Update checkout
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/codeloom
          git fetch --prune origin main
          git reset --hard origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Install dependencies
        working-directory: /opt/codeloom
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: /opt/codeloom
        run: pnpm run build

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" bash -c 'set -a; . /etc/codeloom.env; set +a; cd /opt/codeloom/server; go run ./cmd/migrate up'

      - name: Restart application
        run: sudo systemctl restart codeloom

      - name: Verify application
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5181/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          sudo systemctl status codeloom --no-pager
          exit 1
