# Codeloom modification of Multica v0.5.0: source-built, isolated internal deployment.
# Layer AFTER docker-compose.selfhost.yml and docker-compose.selfhost.build.yml.
# Requires Docker Compose >= 2.24.4 for !override. Never publish PostgreSQL.
# Generate .env.codeloom with node scripts/codeloom-init.mjs --help.
name: codeloom

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env.codeloom with scripts/codeloom-init.mjs}

  backend:
    image: codeloom-backend:dev
    pull_policy: build
    build:
      args:
        VERSION: v0.5.0-codeloom
    ports: !override
      - "${BIND_ADDRESS:?Set a specific LAN IPv4 address}:${BACKEND_PORT:-8180}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_ORIGIN: ${CODELOOM_PUBLIC_ORIGIN:?Set the browser-facing origin}
      MULTICA_APP_URL: ${CODELOOM_PUBLIC_ORIGIN:?Set the browser-facing origin}
      # Direct daemon/webhook access uses HTTP: the backend does not terminate TLS.
      # PUBLIC_HOST is the hostname extracted from CODELOOM_PUBLIC_ORIGIN by the generator.
      MULTICA_PUBLIC_URL: http://${PUBLIC_HOST:?Set the hostname from CODELOOM_PUBLIC_ORIGIN}:${BACKEND_PORT:-8180}
      MULTICA_DAEMON_SERVER_URL: http://${PUBLIC_HOST:?Set the hostname from CODELOOM_PUBLIC_ORIGIN}:${BACKEND_PORT:-8180}
      CORS_ALLOWED_ORIGINS: ${CODELOOM_PUBLIC_ORIGIN:?Set the browser-facing origin}
      COOKIE_DOMAIN: ""
      APP_ENV: production
      MULTICA_DEV_VERIFICATION_CODE: ""
      # Explicit email allowlists precede ALLOW_SIGNUP in upstream auth policy.
      # false also prevents a whitespace-only allowlist from opening signups.
      ALLOW_SIGNUP: "false"
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?Set a comma-separated team email allowlist}
      ALLOWED_EMAIL_DOMAINS: ""
      DISABLE_WORKSPACE_CREATION: "false"
      DO_NOT_TRACK: "1"
      ANALYTICS_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      MULTICA_CLOUD_URL: ""
      MULTICA_VCS_INTEGRATION_ENABLED: "true"
      MULTICA_VCS_SECRET_KEY: ${MULTICA_VCS_SECRET_KEY:?Generate a base64-encoded 32-byte VCS key}

  frontend:
    image: codeloom-web:dev
    pull_policy: build
    build:
      args:
        NEXT_PUBLIC_APP_VERSION: v0.5.0-codeloom
    ports: !override
      - "${BIND_ADDRESS:?Set a specific LAN IPv4 address}:${FRONTEND_PORT:?Set the frontend host port}:3000"
    environment:
      REMOTE_API_URL: http://backend:8080
      # Preserve upstream same-origin browser API, uploads, and WebSocket routing.
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
      DOCS_URL: ""
      DO_NOT_TRACK: "1"
      ANALYTICS_DISABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      MULTICA_DEFAULT_LOCALE: zh-Hans
